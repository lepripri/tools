<!doctype html>
<html style="background-color: #fcb1e3;">
    <head>
        <script src="https://lepripri.github.io/allPages.js"></script>
        <script>
            var translation = {
                test: {
                    fr: true,
                    en: true
                },
                title: {
                    fr: "tous les outils le pripri pratiques",
                    en: "all le pripri tools"
                },
                description: {
                    fr: "Des outils pratique pour votre vie au quotidien, le travail, ... de bonne qualité et utiles. Plus de 1 outil vous est à disposition\
Utilisez ces outils le pripri gratuitement sans publicité et sans revente de données (si avez un doute, le serveur le pripri en est incapble), toutes données sont sauvgarées sur vottre ordinateur",

            if (translation.test[localStorage.lang.substring(0, 2)]) {

            }
            lepripriAPI.import.pageCreatorEditor();

                changer.pressetType.itemList.generateItem("framexplorer", "frame explorer", "/frame-explorer/", "assets/framexplorer.png"),

    </head>
